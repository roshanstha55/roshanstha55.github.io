<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Glowmere: Logic Puzzles – level challenge</title>
<meta name="description" content="Glowmere is a cosy logic puzzle game by Vexel Interactive.">
<link rel="icon" href="../icon-512.png">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
<div class="hero">
  <img src="../icon-512.png" alt="Glowmere app icon">
  <div>
    <h1>Glowmere</h1>
    <p class="muted">A cosy logic puzzle game by Vexel Interactive.</p>
  </div>
</div>
<div class="card" style="margin-top:24px">
  <p id="line"><strong>Can you beat this Glowmere level?</strong></p>
  <p>Place one light in every coloured patch, row and column, and never let two lights touch.</p>
  <p><a href="https://play.google.com/store/apps/details?id=com.vexelinteractive.glowmere">Get Glowmere on Google Play</a></p>
</div>
<footer><a href="../privacy.html">Privacy</a> · <a href="../terms.html">Terms</a> · Contact: <a href="mailto:roshanstha55@gmail.com">roshanstha55@gmail.com</a><br>© 2026 Vexel Interactive</footer>
</main>
<script>
// Reads only l (level, 1–300) and s (score, up to 6 digits). Anything else keeps the generic line.
// No redirects, no other parameters, no HTML from the link (textContent only).
(function () {
  var q = new URLSearchParams(window.location.search);
  var num = function (v, max) { return /^\d{1,6}$/.test(v || '') && Number(v) <= max ? Number(v) : null; };
  var level = num(q.get('l'), 300), score = num(q.get('s'), 999999);
  if (level === null || level < 1 || score === null) return;
  var strong = document.createElement('strong');
  strong.textContent = 'Score ' + score.toLocaleString('en-US') + ' on level ' + level + '. Can you beat it?';
  var line = document.getElementById('line');
  line.textContent = '';
  line.appendChild(strong);
})();
</script>
</body>
</html>
